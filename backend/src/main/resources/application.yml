spring:
  application:
    name: urban-risk-intelligence
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/urban-risk}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
app:
  seed-enabled: ${SEED_ENABLED:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
